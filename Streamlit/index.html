<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <script src="https://unpkg.com/satellite.js/dist/satellite.min.js"></script>
</head>
<body>
  <h2>Satellite Orbit Plotter (Browser-side with satellite.js)</h2>

  <p>Paste multiple TLEs (name + 2 lines per satellite):</p>
  <textarea id="tleInput" rows="10" cols="80">ISS (ZARYA)
1 25544U 98067A   24231.52626736  .00016717  00000-0  30429-3 0  9991
2 25544  51.6440  84.5455 0006726  45.7158  63.2493 15.49935690466779

CSS (TIANHE)
1 48274U 21035A   25236.91221897  .00021444  00000+0  27720-3 0  9998
2 48274  41.4658 324.1791 0006288 228.9562 131.0733 15.58407520246872</textarea>
  <br>
  <button onclick="plotOrbits()">Plot Orbits</button>

  <div id="orbitPlot" style="width:100%;height:700px;margin-top:20px;"></div>

  <script>
    function propagateOrbit(tleLine1, tleLine2, minutes=90, step=5) {
      const satrec = satellite.twoline2satrec(tleLine1, tleLine2);
      const now = new Date();

      const times = [];
      const xs = [], ys = [], zs = [];

      for (let m = 0; m <= minutes; m += step) {
        const time = new Date(now.getTime() + m * 60000);
        const gmst = satellite.gstime(time);
        const eci = satellite.propagate(satrec, time);
        if (eci.position) {
          const posGd = satellite.eciToEcf(eci.position, gmst);
          xs.push(posGd.x); ys.push(posGd.y); zs.push(posGd.z);
          times.push(time.toISOString());
        }
      }
      return { xs, ys, zs };
    }

    function plotOrbits() {
      const tleText = document.getElementById("tleInput").value.trim().split("\n");
      const traces = [];

      for (let i = 0; i < tleText.length; i += 3) {
        if (i + 2 >= tleText.length) break;
        const name = tleText[i].trim();
        const line1 = tleText[i+1].trim();
        const line2 = tleText[i+2].trim();

        const orbit = propagateOrbit(line1, line2, 180, 10); // 3 hours, 10 min step
        traces.push({
          x: orbit.xs,
          y: orbit.ys,
          z: orbit.zs,
          mode: 'lines',
          type: 'scatter3d',
          name: name
        });
      }

      Plotly.newPlot('orbitPlot', traces, {
        title: "Orbits",
        scene: {xaxis:{title:"X"}, yaxis:{title:"Y"}, zaxis:{title:"Z"}}
      });
    }
  </script>
</body>
</html>
