<script>
  let satellites = [];
  let intervalId;

  function parseTLEs(tleText) {
    const lines = tleText
      .split("\n")
      .map(l => l.trim())
      .filter(l => l.length > 0); // remove blanks

    const sats = [];
    for (let i = 0; i < lines.length; i += 3) {
      if (i + 2 >= lines.length) break;
      const name = lines[i];
      const line1 = lines[i + 1];
      const line2 = lines[i + 2];
      const satrec = satellite.twoline2satrec(line1, line2);
      sats.push({ name, satrec });
    }
    return sats;
  }

  function propagatePosition(satrec, time) {
    const pv = satellite.propagate(satrec, time);
    if (!pv.position) return null;
    const gmst = satellite.gstime(time);
    return satellite.eciToEcf(pv.position, gmst);
  }

  function computeOrbitPath(satrec, minutes=180, step=10) {
    const now = new Date();
    const xs = [], ys = [], zs = [];
    for (let m = 0; m <= minutes; m += step) {
      const future = new Date(now.getTime() + m * 60000);
      const ecf = propagatePosition(satrec, future);
      if (ecf) {
        xs.push(ecf.x); ys.push(ecf.y); zs.push(ecf.z);
      }
    }
    return { xs, ys, zs };
  }

  function updatePlot() {
    const now = new Date();
    const traces = [];

    satellites.forEach((sat, idx) => {
      // Current dot
      const ecf = propagatePosition(sat.satrec, now);
      if (ecf) {
        traces.push({
          x: [ecf.x],
          y: [ecf.y],
          z: [ecf.z],
          mode: 'markers',
          type: 'scatter3d',
          name: sat.name + " current",
          marker: { size: 5, color: 'red' }
        });
      }

      // Orbit path
      const path = computeOrbitPath(sat.satrec);
      traces.push({
        x: path.xs,
        y: path.ys,
        z: path.zs,
        mode: 'lines',
        type: 'scatter3d',
        name: sat.name + " orbit",
        line: { width: 2 }
      });
    });

    Plotly.newPlot('orbitPlot', traces, {
      title: "Real-Time Satellite Positions + Orbits",
      scene: { xaxis:{title:"X"}, yaxis:{title:"Y"}, zaxis:{title:"Z"} }
    });
  }

  function startTracking() {
    const tleText = document.getElementById("tleInput").value;
    satellites = parseTLEs(tleText);

    if (intervalId) clearInterval(intervalId);
    updatePlot();
    intervalId = setInterval(updatePlot, 5000);
  }
</script>
