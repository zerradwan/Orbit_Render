<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Satellite Tracker with CesiumJS</title>
  <script src="https://unpkg.com/cesium/Build/Cesium/Cesium.js"></script>
  <link href="https://unpkg.com/cesium/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <script src="https://unpkg.com/satellite.js/dist/satellite.min.js"></script>
  <style>
    html, body, #cesiumContainer {
      width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
    }
    #tleInput {
      position: absolute; top: 10px; left: 10px; z-index: 10;
      width: 400px; height: 150px;
    }
    #startBtn {
      position: absolute; top: 170px; left: 10px; z-index: 10;
    }
  </style>
</head>
<body>
  <textarea id="tleInput">ISS (ZARYA)
1 25544U 98067A   24231.52626736  .00016717  00000-0  30429-3 0  9991
2 25544  51.6440  84.5455 0006726  45.7158  63.2493 15.49935690466779</textarea>
  <button id="startBtn">Start Tracking</button>

  <div id="cesiumContainer"></div>

  <script>
    const viewer = new Cesium.Viewer("cesiumContainer", {
      timeline: false,
      animation: false,
      baseLayerPicker: false
    });

    let satellites = [];

    function parseTLEs(text) {
      const lines = text.trim().split("\n").map(l => l.trim()).filter(l => l.length > 0);
      const sats = [];
      for (let i = 0; i < lines.length; i += 3) {
        if (i + 2 >= lines.length) break;
        const name = lines[i];
        const l1 = lines[i+1];
        const l2 = lines[i+2];
        try {
          sats.push({ name, satrec: satellite.twoline2satrec(l1, l2) });
        } catch (err) {
          console.error("Bad TLE", err);
        }
      }
      return sats;
    }

    function addSatellites() {
      satellites.forEach(sat => {
        sat.entity = viewer.entities.add({
          name: sat.name,
          point: { pixelSize: 6, color: Cesium.Color.RED },
          label: {
            text: sat.name,
            font: "12px sans-serif",
            pixelOffset: new Cesium.Cartesian2(10, -10),
            fillColor: Cesium.Color.YELLOW
          }
        });
      });
    }

    function updateSatellites() {
      const now = new Date();
      const gmst = satellite.gstime(now);

      satellites.forEach(sat => {
        const pv = satellite.propagate(sat.satrec, now);
        if (pv.position) {
          const posEcf = satellite.eciToEcf(pv.position, gmst);
          const posCart = Cesium.Cartesian3.fromElements(
            posEcf.x * 1000,  // convert km to m
            posEcf.y * 1000,
            posEcf.z * 1000
          );
          sat.entity.position = posCart;
        }
      });
    }

    document.getElementById("startBtn").addEventListener("click", () => {
      satellites = parseTLEs(document.getElementById("tleInput").value);
      addSatellites();
      // update once per second
      setInterval(updateSatellites, 1000);
    });
  </script>
</body>
</html>
