<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Satellite Tracker with CesiumJS</title>
  <!-- Versions are pinned: unpinned URLs broke when satellite.js v7 removed its browser (UMD) build -->
  <script src="https://unpkg.com/cesium@1.142.0/Build/Cesium/Cesium.js"></script>
  <link href="https://unpkg.com/cesium@1.142.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <script src="https://unpkg.com/satellite.js@5.0.0/dist/satellite.min.js"></script>
  <style>
    html, body, #cesiumContainer {
      width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
    }
    #tleInput {
      position: absolute; top: 10px; left: 10px; z-index: 10;
      width: 400px; height: 150px;
    }
    #startBtn {
      position: absolute; top: 170px; left: 10px; z-index: 10;
    }
  </style>
</head>
<body>
  <textarea id="tleInput">ISS (ZARYA)
1 25544U 98067A   26162.96453450  .00008067  00000+0  15344-3 0  9993
2 25544  51.6334 325.9414 0004931 175.6343 184.4689 15.49182446570947</textarea>
  <button id="startBtn">Start Tracking</button>

  <div id="cesiumContainer"></div>

  <script>
    const viewer = new Cesium.Viewer("cesiumContainer", {
      timeline: false,
      animation: false,
      baseLayerPicker: false,
      geocoder: false,
      // Use the offline imagery bundled with Cesium so no Ion access token is needed
      baseLayer: Cesium.ImageryLayer.fromProviderAsync(
        Cesium.TileMapServiceImageryProvider.fromUrl(
          Cesium.buildModuleUrl("Assets/Textures/NaturalEarthII")
        )
      )
    });

    let satellites = [];
    let updateTimer = null;

    function parseTLEs(text) {
      const lines = text.trim().split("\n").map(l => l.trim()).filter(l => l.length > 0);
      const sats = [];
      for (let i = 0; i < lines.length; i += 3) {
        if (i + 2 >= lines.length) break;
        const name = lines[i];
        const l1 = lines[i+1];
        const l2 = lines[i+2];
        try {
          sats.push({ name, satrec: satellite.twoline2satrec(l1, l2) });
        } catch (err) {
          console.error("Bad TLE", err);
        }
      }
      return sats;
    }

    function addSatellites() {
      satellites.forEach(sat => {
        sat.entity = viewer.entities.add({
          name: sat.name,
          point: { pixelSize: 6, color: Cesium.Color.RED },
          label: {
            text: sat.name,
            font: "12px sans-serif",
            pixelOffset: new Cesium.Cartesian2(10, -10),
            fillColor: Cesium.Color.YELLOW
          }
        });
      });
    }

    function updateSatellites() {
      const now = new Date();
      const gmst = satellite.gstime(now);

      satellites.forEach(sat => {
        const pv = satellite.propagate(sat.satrec, now);
        if (pv.position) {
          const posEcf = satellite.eciToEcf(pv.position, gmst);
          const posCart = Cesium.Cartesian3.fromElements(
            posEcf.x * 1000,  // convert km to m
            posEcf.y * 1000,
            posEcf.z * 1000
          );
          sat.entity.position = posCart;
        }
      });
    }

    document.getElementById("startBtn").addEventListener("click", () => {
      // Reset any previous tracking session
      if (updateTimer) clearInterval(updateTimer);
      viewer.entities.removeAll();

      satellites = parseTLEs(document.getElementById("tleInput").value);
      if (satellites.length === 0) {
        alert("No valid TLEs found. Paste 3 lines per satellite: name, line 1, line 2.");
        return;
      }
      addSatellites();
      updateSatellites(); // show immediately, then update once per second
      updateTimer = setInterval(updateSatellites, 1000);
    });
  </script>
</body>
</html>
